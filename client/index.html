    <!-- GitHub Pages Single Page App redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  <body>
    <div id="initial-loader" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,hsl(355 70% 88%),hsl(0 0% 97%),hsl(215 60% 88%));flex-direction:column;gap:20px;transition:opacity 0.4s ease;">
      <style>@keyframes lijobs-spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}</style>
      <img src="./icons/icon-192x192.png" alt="LiJOBS" width="72" height="72" style="border-radius:16px;animation:lijobs-spin 1.5s ease-in-out infinite;">
      <span style="font-family:Inter,system-ui,sans-serif;font-size:18px;font-weight:600;color:#002868;">Loading LiJOBS</span>
      <span style="font-family:Inter,system-ui,sans-serif;font-size:13px;color:#555;">Liberia Jobs Observatory System</span>
    </div>
    <script>
      setTimeout(function() {
        var loader = document.getElementById("initial-loader");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(function() { if (loader.parentNode) loader.remove(); }, 400);
        }
      }, 1200);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
